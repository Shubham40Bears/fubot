<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="container text-center">
        <h2>Enter Voucher Code</h2>
        <div class="mb-3">
            <input type="text" id="voucherCode" class="form-control w-50 mx-auto" placeholder="Enter your voucher code">
        </div>
        <button class="btn btn-primary" onclick="showMessage()">Submit</button>
        <div id="message" class="mt-3 text-danger fw-bold"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML = "8444399952 - Contact us for details.";
        }
    </script>
</body>
</html>
